[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultlattice"
version = "0.1.0"
description = "Agent Reliability Harness & Evaluation Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
faultlattice = "faultlattice.cli:app"

[dependency-groups]
# 只声明当前实际使用的组；smolagents / models 等组在接入对应宿主时再添加，
# 不预置空组或装饰性依赖。
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1",
]
