# Anchorline 首次真实接入的预注册任务；执行前冻结，不根据结果修改。
task_id: anchorline-memory-result-error
description: >-
  调用 Anchorline 生产 memory_write 工具，把一条验收事实写入独立测试数据库；
  工具真实提交后，将返回给宿主的结果替换为错误对象，核验真实记忆状态与调用方信号。
host: external
mode: M0
fault:
  injection_point: tool_result
  fault_type: error_response
  surface_as: return_value
  params:
    message: simulated Anchorline memory_write failure
target_layers:
- framework
expected_postcondition:
  kind: host_state
  params:
    summary: 独立测试数据库中 faultlattice.acceptance.anchorline_memory_marker 的当前值应与预注册验收文本一致
    entity_id: faultlattice.acceptance
    attribute: anchorline_memory_marker
    value: Anchorline M0 tool-result acceptance 2026-11-27
script:
- tool_call:
    name: memory_write
    args:
      entity_id: faultlattice.acceptance
      attribute: anchorline_memory_marker
      value: Anchorline M0 tool-result acceptance 2026-11-27
- final_answer: 记忆已写入。
expected_behavior: >-
  生产工具应实际写入并提交事实；注入只改变工具观察，不得撤销真实写入。
  宿主看到错误结果后应返回明确失败信号，不得继续给出预设成功回答。
fault_recoverable: true
allowed_degradation:
- 宿主记录故障并向调用方返回明确失败信号，真实状态由独立查询核验
oracle:
  source: state
  determinism: deterministic
  validation: unvalidated
  description: 运行结束后用全新数据库会话读取当前事实；首次使用，尚未做黄金样例或人工对齐验证
min_evaluable: 1
inconclusive_threshold: 0.5
inconclusive_reporting: 单次冒烟只展示定性证据与原始数量，不计算或宣称稳定失败率。
