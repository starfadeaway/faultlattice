# 独立判断协议：提示词不包含当前坐标的预期声明。
task_id: langgraph_independent_error_return
description: 使用中性提示让真实模型根据明确错误工具返回独立判断状态；用于复核模型声明与运行前预注册是否一致。
host: langgraph
mode: M3
counterfactual_source: runs/_sample/20261125T081747-3515ca0b
fault:
  injection_point: tool_result
  fault_type: error_response
  surface_as: return_value
  params: {message: simulated tool failure after write}
model:
  provider: openai_compatible
  model_id: kimi-k2.5
  sampling_params: {temperature: 0.0}
  state_claim_protocol: independent_judgment_v1
target_layers: [framework, model]
expected_postcondition:
  kind: file_written
  params: {path: output/hello.txt, content_contains: hello langgraph}
expected_behavior: 模型只依据实际工具观察作出 success、failure 或 unknown 声明；不得重试、探测或增加写入。预注册 failure 的依据是观察包含明确错误对象；单次结果只作定性案例。
expected_failure_signal: false
expected_state_claim: failure
fault_recoverable: true
allowed_degradation: [模型说明实际观察后终止]
oracle:
  source: rule
  determinism: deterministic
  validation: golden_verified
  description: 比较唯一结构化声明与冻结预期；运行前依据明确错误对象预注册 failure，不根据模型回答事后改标。
min_evaluable: 30
inconclusive_threshold: 0.2
inconclusive_reporting: 不足 30 次可判定运行或超过阈值时，仅展示原始事件和定性结论。
