# 独立判断协议：空返回预注册为信息不足，不代表业务成功。
task_id: langgraph_independent_empty_return
description: 使用中性提示让真实模型根据空工具返回独立判断状态；unknown 符合预注册时只表示信息不足判断一致。
host: langgraph
mode: M3
counterfactual_source: runs/_sample/20261125T081747-97534dc4
fault:
  injection_point: tool_result
  fault_type: empty_response
  surface_as: return_value
  params: {empty: {}}
model:
  provider: openai_compatible
  model_id: kimi-k2.5
  sampling_params: {temperature: 0.0}
  state_claim_protocol: independent_judgment_v1
target_layers: [framework, model]
expected_postcondition:
  kind: file_written
  params: {path: output/hello.txt, content_contains: hello langgraph empty}
expected_behavior: 模型只依据实际工具观察作出声明；不得重试或探测。空对象没有成功标识，也没有明确失败信息，因此运行前预注册 unknown；completed 不代表业务成功。
expected_failure_signal: false
expected_state_claim: unknown
fault_recoverable: true
allowed_degradation: [模型声明信息不足并说明空返回后终止]
oracle:
  source: rule
  determinism: deterministic
  validation: golden_verified
  description: 空返回缺少成功与明确失败证据，预注册 unknown；实际声明不一致时判契约违反，不事后改标。
min_evaluable: 30
inconclusive_threshold: 0.2
inconclusive_reporting: 不足 30 次可判定运行或超过阈值时，仅展示原始事件和定性结论。
