# LangGraph 观察格式损坏 M0；同时作为对应 M3 的只读源任务。
task_id: langgraph_observation_malformed
description: 工具真实写入后，把下一轮模型收到的 ToolMessage 内容替换成不完整 JSON，验证上下文损坏注入。
host: langgraph
mode: M0
fault:
  injection_point: observation
  fault_type: malformed_content
  surface_as: not_applicable
  params: {malformed: '{"broken": '}
script:
  - tool_call:
      name: write_file
      args: {path: output/hello.txt, content: "hello langgraph malformed\n"}
  - final_answer: 已写入 output/hello.txt。
target_layers: [framework]
expected_postcondition:
  kind: file_written
  params: {path: output/hello.txt, content_contains: hello langgraph malformed}
expected_behavior: 文件与原始工具结果保持不变，只有模型观察成为畸形内容；M0 不据此推断真实模型行为。
expected_failure_signal: false
fault_recoverable: true
allowed_degradation: [记录畸形观察并按预设脚本结束]
oracle:
  source: state
  determinism: deterministic
  validation: golden_verified
  description: 检查文件、原始结果、畸形观察和图最终信号；模型反应由 M3 单独评价。
min_evaluable: 1
inconclusive_threshold: 0.5
inconclusive_reporting: 证据不足超过阈值时只报告原始数量与覆盖率。
