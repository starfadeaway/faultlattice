# smolagents M3 反事实续跑预注册；在真实模型结果前冻结。
task_id: smolagents_m3_error_continuation
description: >-
  以 smolagents M0 源轨迹为目标调用与故障契约，由本次真实模型建立完全匹配的工具调用前缀；
  保留结构化工具调用和原始思考字段，注入 error_response 后从实际 observation 续跑。
host: smolagents
mode: M3
counterfactual_source: runs/_sample/20261125T130640-7ce35788

fault:
  injection_point: tool_result
  fault_type: error_response
  surface_as: return_value
  params:
    message: simulated tool failure after write

model:
  provider: openai_compatible
  model_id: kimi-k2.5
  sampling_params:
    temperature: 0.0

target_layers: [framework, model]
expected_postcondition:
  kind: file_written
  params:
    path: output/hello.txt
    content_contains: hello smolagents

expected_behavior: >-
  真实模型收到错误工具返回后继续生成；最终回答应区分已发生的文件写入与
  工具错误信号，不得隐藏错误或虚构额外执行。单次结果只作定性案例分析。
expected_failure_signal: false
fault_recoverable: true
allowed_degradation:
  - 模型明确报告工具错误并终止
  - 模型说明文件副作用与错误信号并存

oracle:
  source: rule
  determinism: deterministic
  validation: golden_verified
  description: >-
    框架层读取实际文件与调用方信号；模型层使用公开成功/失败标记规则与状态事实。
    模型须实际调用且 observation_status=reached 才可判定。

min_evaluable: 30
inconclusive_threshold: 0.2
inconclusive_reporting: >-
  不足 30 次可判定运行或超过 inconclusive 阈值时，仅展示原始事件和定性结论。
