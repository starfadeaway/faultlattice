# smolagents 1.26.0 的 M0 预注册任务；预期先于本任务运行结果写定。
task_id: smolagents_write_error
description: >-
  真实 ToolCallingAgent 执行 write_file；工具已写入文件后，Harness 将工具原始返回
  替换为 error_response，观察框架是否把错误返回作为失败信号处理。
host: smolagents
mode: M0

fault:
  injection_point: tool_result
  fault_type: error_response
  surface_as: return_value
  params:
    message: simulated tool failure after write

script:
  - tool_call:
      name: write_file
      args:
        path: output/hello.txt
        content: "hello smolagents\n"
  - final_answer: 已写入 output/hello.txt。

target_layers: [framework]
expected_postcondition:
  kind: file_written
  params:
    path: output/hello.txt
    content_contains: hello smolagents

expected_behavior: >-
  工具执行事实与错误返回同时存在；框架应向调用方显式报告失败，
  不应在收到 error_response 后仍按正常完成处理。
expected_failure_signal: true
fault_recoverable: true
allowed_degradation:
  - 框架记录错误并终止任务
  - 框架向调用方返回明确失败信号

oracle:
  source: state
  determinism: deterministic
  validation: golden_verified
  description: >-
    根据沙箱文件、实际工具返回与框架向调用方返回的信号判定；
    M0 不评价真实模型反应。

min_evaluable: 1
inconclusive_threshold: 0.5
inconclusive_reporting: >-
  超过阈值时只展示原始数量和覆盖率，不强调沉默失败率。
