# LangGraph 工具返回异常 M0；运行前冻结预期。
task_id: langgraph_write_exception
description: 真实 ToolNode 写入文件后，将工具结果改成 RuntimeError，检查异常是否传播到图调用方。
host: langgraph
mode: M0
fault:
  injection_point: tool_result
  fault_type: error_response
  surface_as: raise_exception
  params: {message: simulated tool failure after write}
script:
  - tool_call:
      name: write_file
      args: {path: output/hello.txt, content: "hello langgraph exception\n"}
  - final_answer: 已写入 output/hello.txt。
target_layers: [framework]
expected_postcondition:
  kind: file_written
  params: {path: output/hello.txt, content_contains: hello langgraph exception}
expected_behavior: 文件副作用与工具异常同时存在；图应返回明确失败，不得把预设最终回答当作正常完成证据。
fault_recoverable: true
allowed_degradation: [框架记录工具异常并终止任务]
oracle:
  source: state
  determinism: deterministic
  validation: golden_verified
  description: 检查真实文件、注入异常和调用方最终信号；不评价预设模型行为。
min_evaluable: 1
inconclusive_threshold: 0.5
inconclusive_reporting: 证据不足超过阈值时只报告原始数量与覆盖率。
