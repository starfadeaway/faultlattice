name: CI

on:
  push:
  pull_request:

env:
  # Windows runner 默认使用 CP1252；统一 CLI 与检查脚本的中文输出编码。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # canonical JSON / 换行 / 路径行为必须在双平台同时验证（spec 第 7 节）
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # pyright 的 PyPI 包装器通过 nodeenv 自动准备 node 运行时，
      # 这里显式装 node 保证 CI 行为可复现
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 同步依赖（uv.lock 为唯一事实来源）
        run: uv sync --locked --group smolagents --group langgraph --group models --group mysql --group similarity

      - name: pytest（含 golden / meta / architecture / adapters / e2e）
        run: uv run pytest

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: AST 依赖方向检查
        run: uv run pytest tests/architecture/test_imports.py

      - name: 仓库卫生检查
        run: uv run python scripts/check_repo_hygiene.py

      - name: 确定性本地行为回归（现场生成 current）
        run: uv run python scripts/check_public_regression.py --baseline quality/public-sample.yaml --output reports/quality-gate.md

      - name: 外部 Agent 公开产物完整性复算（不冒充独立重跑）
        run: uv run pytest tests/meta/test_public_samples.py -q

      - name: 安装研发视图依赖（lockfile 固定）
        run: npm ci --prefix console/web

      - name: 研发视图 ESLint
        run: npm run lint --prefix console/web

      - name: 研发视图生产构建
        run: npm run build --prefix console/web
