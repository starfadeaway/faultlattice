name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # canonical JSON / 换行 / 路径行为必须在双平台同时验证（spec 第 7 节）
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # pyright 的 PyPI 包装器通过 nodeenv 自动准备 node 运行时，
      # 这里显式装 node 保证 CI 行为可复现
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 同步依赖（uv.lock 为唯一事实来源）
        run: uv sync --locked --group smolagents --group langgraph --group models --group mysql --group similarity

      - name: pytest（含 golden / meta / architecture / adapters / e2e）
        run: uv run pytest

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: AST 依赖方向检查
        run: uv run pytest tests/architecture/test_imports.py

      - name: 仓库卫生检查
        run: uv run python scripts/check_repo_hygiene.py

      - name: 公开样例回归质量门禁
        run: uv run faultlattice quality-gate runs/_sample/20261124T124335-94ebab0a --baseline quality/public-sample.yaml --output reports/quality-gate.md

      - name: 外部 Agent M0 公开样例回归质量门禁
        run: uv run faultlattice quality-gate runs/_sample/20261127T131928-4a109d3f runs/_sample/20261126T175052-1730a492 runs/_sample/20261127T131958-b5e13aff runs/_sample/20261126T180523-058c206a runs/_sample/20261127T145247-77cdae58 runs/_sample/20261127T145248-20a065b6 --baseline quality/external-agent-m0.yaml --output reports/external-agent-quality-gate.md

      - name: 安装研发视图依赖（lockfile 固定）
        run: npm ci --prefix console/web

      - name: 研发视图 ESLint
        run: npm run lint --prefix console/web

      - name: 研发视图生产构建
        run: npm run build --prefix console/web
